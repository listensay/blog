[package]
name = "blog-admin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"
open = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
